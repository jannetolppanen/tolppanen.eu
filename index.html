<!DOCTYPE html>
<html lang="en">
<head>

            background: #000000;
            color: #00FF00;
            font-family: 'Share Tech Mono', 'Consolas', 'Monaco', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: left;

        }
        .prompt {
            color: #00FF00;

        h1 {

            margin: 0;

            letter-spacing: 3px;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #e9eee9;

        }
        @keyframes cursor-blink {

            50%, 100% { opacity: 0; }
        }
        .line {

        .output {
            margin-top: 20px;
            padding-top: 20px;
