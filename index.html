<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tolppanen.eu</title>
    <style>
        body {
            background: #000000;
            color: #00FF00;
            font-family: "Courier New", monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: left;
            max-width: 600px;
        }
        .prompt {
            color: #00FF00;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 36px;
            margin: 0;
            color: #00FF00;
            font-weight: normal;
            letter-spacing: 3px;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #00FF00;
            animation: cursor-blink 1s infinite;
            margin-left: 5px;
        }
        @keyframes cursor-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .line {
            margin: 5px 0;
            font-size: 14px;
        }
        .output {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #00FF00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="line">root@server:~$ cat /var/www/index.txt</div>
        <div class="line">Loading...</div>
        <div class="output">
            <div class="line">=====================================</div>
            <h1>tolppanen.eu<span class="cursor"></span></h1>
            <div class="line">=====================================</div>
            <div class="line" style="margin-top: 20px;">Connection established.</div>
            <div class="line">Status: ONLINE</div>
        </div>
    </div>
</body>
</html>
